<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreamDrop</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="home-wrap">
  <div class="gift">🎁</div>
  <h1>Stream<span style="color:var(--accent)">Drop</span></h1>
  <p>라이브 방송 QR 참여 · 실시간 추첨 · 당첨자 휴대폰 수령</p>
  <div class="home-actions">
    <a class="btn accent" href="/join">📱 참여하기</a>
    <a class="btn twitch" href="/overlay">📺 OBS 오버레이</a>
    <a class="btn" style="background:#33334a" href="/admin?token=streamdrop">🛠 운영자 콘솔</a>
  </div>
</div>
<script>
// Twitch OAuth가 루트로 돌아와도 토큰을 잃지 않고 참여 화면에서 처리한다.
const oauthQuery = new URLSearchParams(location.search);
if (
  location.hash.includes("access_token") ||
  oauthQuery.has("code") ||
  oauthQuery.has("error")
) {
  location.replace("/join" + location.search + location.hash);
}
</script>
</body>
</html>
